[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amase"
version = "0.1.0"
description = "Measure how much of an LLM agent run was spent after it was already failing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Aryan Raj Singh" }]
keywords = ["llm", "agents", "claude-code", "reliability", "observability", "tokens"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/its-aryansingh/amase"
Issues = "https://github.com/its-aryansingh/amase/issues"

[project.scripts]
amase = "amase.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amase"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
