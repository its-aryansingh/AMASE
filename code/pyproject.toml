[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amase"
version = "0.1.0"
description = "Measure how much of an LLM agent run was spent after it was already failing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Aryan Raj Singh" }]
keywords = ["llm", "agents", "claude-code", "reliability", "observability", "tokens"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[project.urls]
Homepage = "https://github.com/its-aryansingh/AMASE"
Issues = "https://github.com/its-aryansingh/AMASE/issues"

[project.scripts]
amase = "amase.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amase"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

# The rule set is pinned explicitly rather than left to ruff's defaults.
# Defaults are a moving target -- 0.16 widened them, which turned a green
# checkout red without a line of this project changing. A repository whose CI
# breaks when a tool ships a release is a repository people stop trusting, so
# the selection lives here where a change to it is a reviewable commit.
#
# E501 is deliberately absent: the formatter owns line length, and having the
# linter disagree with the formatter about the same line helps nobody.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
